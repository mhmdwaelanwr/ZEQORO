name: One-time cleanup of already merged ZEQORO branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-branches.yml
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'mhmdwaelanwr/ZEQORO'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the verified merged feature refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GITHUB_TOKEN"]
          assert REPO == "mhmdwaelanwr/ZEQORO", "Unexpected repository"
          EXPECTED = {
            "feature/v0.2-scheduling-ux": "5a6c00a30e777d6bb93f986440d2b3589b178be7",
            "feature/v0.3-security-design": "605aab51e22652b00eb71c79bde4af38b46d8388",
            "feature/v0.4-figma-to-web": "f0b6763f4b4f9dba2674bf0a8807c4b7841c7caf",
            "feature/v0.5-unified-experience": "2eb5f3fdd99b584598a2e829db83dfdeaccf56bc",
            "feature/v0.6-google-calendar-meet": "deb122fcf197e2f53e49701b36694ac2b9f2fadf",
            "feature/v0.7-postgres-redis-worker": "fe4f0526e4d9c18a391f473bdf22d2c7ac012f4a",
            "feature/v0.8-team-workspace": "ab810b7b30cf9bdb6de9812cbeaf3b2cd339068f",
            "feature/v0.9-team-google-sync": "205ff29171dc0d53fc5cc4a01dd0a02df72b1b31",
            "feature/v1.0-multicalendar-push": "a030e4443311d55fcabd84babb3a9e586d04e60f"
          }
          
          def request(method, endpoint):
              url = "https://api.github.com/" + endpoint
              req = urllib.request.Request(url, method=method, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + TOKEN,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ZEQORO-merged-branches-cleanup",
              })
              with urllib.request.urlopen(req, timeout=25) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          
          deleted = []
          skipped = []
          for branch, expected_sha in EXPECTED.items():
              if not branch.startswith("feature/"):
                  raise RuntimeError("Unapproved ref in manifest")
              encoded = urllib.parse.quote(branch, safe="")
              try:
                  details = request("GET", f"repos/{REPO}/branches/{encoded}")
              except urllib.error.HTTPError as err:
                  if err.code == 404:
                      print(f"Already absent: {branch}")
                      continue
                  raise
              actual_sha = details["commit"]["sha"]
              if details.get("protected") or actual_sha != expected_sha:
                  skipped.append(branch)
                  print(f"SKIPPED (protected or changed): {branch}")
                  continue
              comparison = request("GET", f"repos/{REPO}/compare/main...{actual_sha}")
              if comparison.get("ahead_by") != 0:
                  skipped.append(branch)
                  print(f"SKIPPED (unmerged commits): {branch}")
                  continue
              request("DELETE", f"repos/{REPO}/git/refs/heads/{encoded}")
              deleted.append(branch)
              print(f"DELETED: {branch}")
          print(f"Cleanup: {len(deleted)} deleted, {len(skipped)} safely skipped.")
          if skipped:
              raise SystemExit("Review skipped branches manually before deleting.")
          PY
