name: Python CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zeqoro
          POSTGRES_DB: zeqoro_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeqoro -d zeqoro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
      - run: python tests/integration_pg.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check static/booking.js
      - run: node --check static/site.js
      - run: python -m compileall -q app.py google_integration.py infra.py worker.py team.py tests
